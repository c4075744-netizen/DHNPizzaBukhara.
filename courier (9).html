const hv=(a,b)=>{const r=x=>x*Math.PI/180,q=Math.sin(r(b[0]-a[0])/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(r(b[1]-a[1])/2)**2;return 12742000*Math.asin(Math.sqrt(q))},fm=m=>m>=1000?(m/1000).toFixed(1)+' км':Math.max(10,Math.round(m/10)*10)+' м',

brg=(a,b)=>{const r=Math.PI/180,y=Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r),x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);return(Math.atan2(y,x)/r+360)%360},

async function route(p){const n=nv;try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${p[1]},${p[0]};${n.dest[1]},${n.dest[0]}?overview=full&geometries=geojson&steps=true`),j=await r.json(),rt=j.routes&&j.routes[0];if(!rt)throw 0;n.steps=rt.legs[0].steps;n.si=Math.min(1,n.steps.length-1);n.pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]);setRt(n,rt.geometry);n.spoken='';if(n.first){n.first=0;const b=new maplibregl.LngLatBounds([p[1],p[0]],[p[1],p[0]]);n.pts.forEach(q=>b.extend([q[1],q[0]]));n.map.fitBounds(b,{padding:{top:150,bottom:280,left:40,right:70},duration:1200});n.follow=false;setTimeout(()=>{if(nv)nv.follow=true},3500)}}catch(e){$('#nt').textContent='Не удалось построить маршрут. Проверьте интернет'}}
function show(p){const n=nv,s=n.steps[n.si],d=hv(p,[s.maneuver.location[1],s.maneuver.location[0]]);let rem=d,t=0;for(let j=n.si;j<n.steps.length;j++){rem+=n.steps[j].distance;t+=n.steps[j].duration}const tx=say(s),st=d<70?2:d<300?1:0,k=n.si+':'+st;
$('#na').textContent=icon(s);$('#nd').textContent=fm(d);$('#nt').textContent=tx;$('#ns').textContent=fm(rem)+' · '+Math.max(1,Math.round(t/60))+' мин';
if(n.voice&&st>0&&n.spoken!=k){n.spoken=k;speak((st==1&&s.maneuver.type!='arrive'?'Через '+(Math.round(d/50)*50)+' метров ':'')+tx)}}
async function navPos(p,cs){const n=nv;if(!n)return;let hd=n.hd||0;if(cs&&cs.heading!=null&&!isNaN(cs.heading)&&(cs.speed||0)>1.2)hd=cs.heading;else if(n.prev&&hv(n.prev,p)>6)hd=brg(n.prev,p);if(!n.prev||hv(n.prev,p)>6)n.prev=p;n.hd=hd;
$('#nsp').textContent=cs&&cs.speed!=null?Math.round(cs.speed*3.6):0;n.me.setLngLat([p[1],p[0]]);
if(n.follow)n.map.easeTo({center:[p[1],p[0]],bearing:hd,pitch:62,zoom:17.3,duration:900,offset:[0,170],essential:true});
const off=n.pts.length?Math.min(...n.pts.map(q=>hv(p,q))):1e9;if(Date.now()-n.lastRt>12000&&(off>120||!n.steps.length)){n.lastRt=Date.now();await route(p)}if(!n.steps.length||!nv)return;
