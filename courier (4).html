<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Курьер — DHNPizzaBukhara</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><style>#nav{position:fixed;inset:0;z-index:2000;background:#000}#nm{position:absolute;inset:0}#ni{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));background:#15803d;border-radius:18px;padding:12px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px #0008}#na{font:900 46px system-ui;width:60px;text-align:center;line-height:1}#nd{font:900 26px system-ui}#nt{font:700 16px system-ui;opacity:.95}#ni small{margin-left:auto;font-weight:800;opacity:.85;align-self:flex-start}#nr{position:absolute;right:10px;top:calc(120px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}#nr button{width:48px;height:48px;padding:0;margin:0;border-radius:50%;font-size:20px;background:#fffe;color:#111}#nsp0{position:absolute;left:12px;bottom:250px;width:62px;height:62px;border-radius:50%;background:#fffe;color:#111;display:grid;place-items:center;text-align:center;line-height:1;font-weight:900}#nsp0 small{font-size:10px}#nb{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#111;border-radius:26px 26px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px #0006}#ns{font:900 24px system-ui;text-align:center}#nb .sub{text-align:center;color:#666;margin-bottom:8px}#nb .row2{padding:8px 0;border-top:1px solid #eee}#nb .br{display:flex;gap:8px;margin-top:8px}#nb .br button{flex:1;margin:0;background:#7b2cbf}#nb .bt{background:#eee;border-radius:99px;padding:12px 20px;text-decoration:none;font-size:18px;color:#111}.mk{font-size:30px;line-height:1;filter:drop-shadow(0 3px 4px #0007);position:relative}.mk.me:before,.mk.pin:before{content:'';position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;animation:pl 1.8s infinite;z-index:-1}.mk.me:before{background:#c8102e55}.mk.pin:before{background:#15803d55}@keyframes pl{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}.maplibregl-map{border-radius:14px}#map{height:300px;border-radius:16px;margin:10px 0;position:relative;z-index:0;isolation:isolate}body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#fff}.w{max-width:560px;margin:auto;padding:16px}.c{background:#1e1e1e;border-radius:18px;padding:14px;margin:10px 0;line-height:1.6}button,input{font:700 16px system-ui;border:0;border-radius:99px;padding:12px 18px;margin:4px 4px 4px 0}button{background:#c8102e;color:#fff;cursor:pointer}button.g{background:#333}input{width:100%;box-sizing:border-box}a{color:#ffb703}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script></head><body><div class="w" id="app">Загрузка…</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,onSnapshot,updateDoc,doc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const app=initializeApp({
    apiKey: "AIzaSyAar_MZbTlVcqyJqJ5P8lSj0GDnkBIJ4rc",
    authDomain: "planning-with-ai-3e898.firebaseapp.com",
    projectId: "planning-with-ai-3e898",
    storageBucket: "planning-with-ai-3e898.firebasestorage.app",
    messagingSenderId: "508120470039",
    appId: "1:508120470039:web:522e6d36480f8a28e34252"
  }),db=getFirestore(app),au=getAuth(app),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),ST={new:'Новый',cook:'Готовится',way:'В дороге'};
let O=[],sh=null,wid=null,last=0,map=null,mnode=null,mk={},fit=0;
const ico=e=>L.divIcon({html:`<div style="font-size:30px;filter:drop-shadow(0 2px 3px #0006)">${e}</div>`,className:'',iconSize:[30,30],iconAnchor:[15,15]});
function setMk(k,p,e,t){mk[k]?mk[k].setLatLng(p):(mk[k]=L.marker(p,{icon:ico(e)}).addTo(map).bindTooltip(t||''))}
function mapUp(){const ph=$('#map');if(!window.L||!ph)return;if(!map){map=L.map(ph).setView([39.7747,64.4286],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);mnode=ph}else if(mnode!==ph){ph.replaceWith(mnode);map.invalidateSize()}
const pts=[];Object.keys(mk).forEach(k=>{if(k[0]=='c'&&!O.some(o=>'c'+o.id==k)){map.removeLayer(mk[k]);delete mk[k]}});
O.forEach(o=>{const g=o.geo&&o.geo.split(',').map(Number);if(g&&!isNaN(g[0])){pts.push(g);setMk('c'+o.id,g,'📍',o.num+' · '+o.n)}});
if(!fit&&pts.length){map.fitBounds(pts,{padding:[30,30],maxZoom:16});fit=1}}
const upd=(id,f)=>updateDoc(doc(db,'orders',id),f);
function gate(){$('#app').innerHTML='<h2>🛵 Курьер</h2><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Пароль"><div id="er" style="color:#f66"></div><button onclick="login()">Войти</button>'}
window.login=()=>signInWithEmailAndPassword(au,$('#e').value.trim(),$('#p').value).catch(e=>$('#er').textContent='Ошибка входа: '+(e.code||''));
window.out=()=>{stop();signOut(au)};
function stop(){if(wid!=null)navigator.geolocation.clearWatch(wid);wid=null;sh=null}
window.take=id=>upd(id,{status:'way',wt:Date.now()});
window.fin=id=>{if(sh==id)stop();upd(id,{status:'done'})};
window.share=id=>{if(sh==id){stop();return draw()}stop();if(!navigator.geolocation)return alert('Геолокация не поддерживается');sh=id;
wid=navigator.geolocation.watchPosition(p=>{if(map)setMk('me',[p.coords.latitude,p.coords.longitude],'🛵','Я');if(Date.now()-last<4000)return;last=Date.now();upd(id,{status:'way',cl:{a:+p.coords.latitude.toFixed(6),o:+p.coords.longitude.toFixed(6),t:Date.now()}})},()=>{alert('Включите геолокацию в браузере и на телефоне — иначе клиент не увидит курьера');stop();draw()},{enableHighAccuracy:true,maximumAge:2000});draw()};
function draw(){$('#app').innerHTML='<div style="display:flex;align-items:center"><h2 style="flex:1">🛵 Заказы</h2><button class="g" onclick="out()">Выйти</button></div><div id="map"></div><div style="color:#aaa;font-size:14px">📍 клиенты · 🛵 вы (когда включена локация)</div>'+(O.map(o=>`<div class="c"><b>${esc(o.num)}</b> · ${ST[o.status]||o.status}<br>${esc(o.n)} · <a href="tel:${esc(o.p)}">${esc(o.p)}</a><br>${esc(o.a)}<br>${o.geo?'':'<span style="color:#f99">⚠️ Клиент не указал точку на карте</span><br>'}${o.geo?`<a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${esc(o.geo)}">🧭 Маршрут</a><br>`:''}${o.items.map(i=>esc(i.n)+' × '+i.q).join(', ')}<br><b>${Number(o.total).toLocaleString('ru-RU')} сум</b> · ${o.pay=='card'?'💳 карта':'💵 наличные'}<div><button onclick="nav('${o.id}')">🧭 DHNMap</button><button onclick="take('${o.id}')">🛵 Забрал, еду</button><button class="${sh==o.id?'':'g'}" onclick="share('${o.id}')">${sh==o.id?'⏹ Выключить локацию':'📡 Показать меня клиенту'}</button><button class="g" onclick="fin('${o.id}')">✅ Доставлен</button></div></div>`).join('')||'<p>Активных заказов нет</p>');mapUp()}

const hv=(a,b)=>{const r=x=>x*Math.PI/180,q=Math.sin(r(b[0]-a[0])/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(r(b[1]-a[1])/2)**2;return 12742000*Math.asin(Math.sqrt(q))},fm=m=>m>=1000?(m/1000).toFixed(1)+' км':Math.max(10,Math.round(m/10)*10)+' м',
MOD={left:'налево',right:'направо','slight left':'левее','slight right':'правее','sharp left':'резко налево','sharp right':'резко направо'},AR={left:'↰',right:'↱','slight left':'↖','slight right':'↗','sharp left':'↰','sharp right':'↱',straight:'↑',uturn:'↶'},
speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}},
brg=(a,b)=>{const r=Math.PI/180,y=Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r),x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);return(Math.atan2(y,x)/r+360)%360},
mkEl=(e,c)=>{const d=document.createElement('div');d.className='mk '+(c||'');d.innerHTML=e;return d},
ARROW='<svg width="46" height="46" viewBox="0 0 44 44"><path d="M22 3 L38 38 L22 30 L6 38 Z" fill="#ffb703" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>';
let nv=null;
function say(s){const m=s.maneuver,n=s.name?' на '+s.name:'';if(m.type=='arrive')return 'Вы прибыли на точку доставки';if(m.type=='depart')return 'Начните движение'+n;if(m.type=='roundabout'||m.type=='rotary')return 'На кольце выезд '+(m.exit||'')+n;if(m.modifier=='uturn')return 'Развернитесь'+n;if(m.modifier=='straight')return 'Продолжайте прямо'+n;return 'Поверните '+(MOD[m.modifier]||'')+n}
const icon=s=>{const m=s.maneuver;return m.type=='arrive'?'🏁':m.type=='roundabout'||m.type=='rotary'?'⟳':m.type=='depart'?'↑':AR[m.modifier]||'↑'};
function setRt(n,g){const f=()=>n.map.getSource('rt').setData({type:'Feature',geometry:g});n.ready?f():n.map.once('load',f)}
async function route(p){const n=nv;try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${p[1]},${p[0]};${n.dest[1]},${n.dest[0]}?overview=full&geometries=geojson&steps=true`),j=await r.json(),rt=j.routes&&j.routes[0];if(!rt)throw 0;n.steps=rt.legs[0].steps;n.si=Math.min(1,n.steps.length-1);n.pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]);setRt(n,rt.geometry);n.spoken='';if(n.first){n.first=0;const b=new maplibregl.LngLatBounds([p[1],p[0]],[p[1],p[0]]);n.pts.forEach(q=>b.extend([q[1],q[0]]));n.map.fitBounds(b,{padding:{top:150,bottom:280,left:40,right:70},duration:1200});n.follow=false;setTimeout(()=>{if(nv)nv.follow=true},3500)}}catch(e){$('#nt').textContent='Не удалось построить маршрут. Проверьте интернет'}}
function show(p){const n=nv,s=n.steps[n.si],d=hv(p,[s.maneuver.location[1],s.maneuver.location[0]]);let rem=d,t=0;for(let j=n.si;j<n.steps.length;j++){rem+=n.steps[j].distance;t+=n.steps[j].duration}const tx=say(s),st=d<70?2:d<300?1:0,k=n.si+':'+st;
$('#na').textContent=icon(s);$('#nd').textContent=fm(d);$('#nt').textContent=tx;$('#ns').textContent=fm(rem)+' · '+Math.max(1,Math.round(t/60))+' мин';
if(n.voice&&st>0&&n.spoken!=k){n.spoken=k;speak((st==1&&s.maneuver.type!='arrive'?'Через '+(Math.round(d/50)*50)+' метров ':'')+tx)}}
async function navPos(p,cs){const n=nv;if(!n)return;let hd=n.hd||0;if(cs&&cs.heading!=null&&!isNaN(cs.heading)&&(cs.speed||0)>1.2)hd=cs.heading;else if(n.prev&&hv(n.prev,p)>6)hd=brg(n.prev,p);if(!n.prev||hv(n.prev,p)>6)n.prev=p;n.hd=hd;
$('#nsp').textContent=cs&&cs.speed!=null?Math.round(cs.speed*3.6):0;n.me.setLngLat([p[1],p[0]]);
if(n.follow)n.map.easeTo({center:[p[1],p[0]],bearing:hd,pitch:62,zoom:17.3,duration:900,offset:[0,170],essential:true});
const off=n.pts.length?Math.min(...n.pts.map(q=>hv(p,q))):1e9;if(Date.now()-n.lastRt>12000&&(off>120||!n.steps.length)){n.lastRt=Date.now();await route(p)}if(!n.steps.length||!nv)return;
while(n.si<n.steps.length-1&&hv(p,[n.steps[n.si].maneuver.location[1],n.steps[n.si].maneuver.location[0]])<25)n.si++;show(p)}
window.nav=id=>{const o=O.find(x=>x.id==id);if(!o||!o.geo)return alert('Клиент не поставил точку на карте — навигатор недоступен');if(!window.maplibregl)return alert('3D-карта не загрузилась. Проверьте интернет');if(!navigator.geolocation)return alert('Нет геолокации в этом браузере');if(nv)return;
document.body.insertAdjacentHTML('beforeend',`<div id="nav"><div id="nm"></div><div id="ni"><div id="na">↑</div><div><div id="nd">—</div><div id="nt">Определяем местоположение…</div></div><small>🧭 DHNMap</small></div><div id="nr"><button id="nvb" onclick="navVoice()">🔊</button><button onclick="navFollow()">🎯</button><button onclick="navFs()">⛶</button><button class="g" onclick="navClose()">✕</button></div><div id="nsp0"><div><b id="nsp" style="font-size:20px">0</b><br><small>км/ч</small></div></div><div id="nb"><div id="ns">—</div><div class="sub">${esc(o.num)} · ${esc(o.n)}</div><div class="row2">💰 ${Number(o.total).toLocaleString('ru-RU')} сум · ${o.pay=='card'?'💳 карта':'💵 наличные'}</div><div class="row2">📍 ${esc(o.a||'')}</div><div class="br"><a class="bt" href="tel:${esc(o.p)}">📞</a><button onclick="fin('${o.id}');navClose()">✅ Доставлен</button></div></div></div>`);
const dest=o.geo.split(',').map(Number),map=new maplibregl.Map({container:'nm',style:'https://tiles.openfreemap.org/styles/liberty',center:[dest[1],dest[0]],zoom:15,pitch:62,maxPitch:75,attributionControl:{compact:true}});
nv={id,dest,map,steps:[],si:0,pts:[],voice:true,lastRt:0,follow:true,spoken:'',first:1,ready:0,hd:0};
map.on('load',()=>{const ly={'line-cap':'round','line-join':'round'};map.addSource('rt',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'rtc',type:'line',source:'rt',layout:ly,paint:{'line-color':'#fff','line-width':13}});map.addLayer({id:'rtl',type:'line',source:'rt',layout:ly,paint:{'line-color':'#1e88e5','line-width':8}});nv&&(nv.ready=1)});
new maplibregl.Marker({element:mkEl('📍','pin')}).setLngLat([dest[1],dest[0]]).addTo(map);nv.me=new maplibregl.Marker({element:mkEl(ARROW)}).setLngLat([dest[1],dest[0]]).addTo(map);
map.on('dragstart',()=>nv&&(nv.follow=false));try{document.getElementById('nav').requestFullscreen?.()}catch(e){}
if(sh!=id)share(id);nv.wid=navigator.geolocation.watchPosition(p=>navPos([p.coords.latitude,p.coords.longitude],p.coords),()=>{$('#nt').textContent='Включите геолокацию, чтобы работал DHNMap'},{enableHighAccuracy:true,maximumAge:1000})};
window.navVoice=()=>{nv.voice=!nv.voice;$('#nvb').textContent=nv.voice?'🔊':'🔇'};window.navFollow=()=>{if(nv)nv.follow=true};
window.navFs=()=>{try{document.fullscreenElement?document.exitFullscreen():document.getElementById('nav').requestFullscreen()}catch(e){}};
window.navClose=()=>{if(!nv)return;navigator.geolocation.clearWatch(nv.wid);nv.map.remove();nv=null;document.getElementById('nav').remove();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}};
gate();onAuthStateChanged(au,u=>{if(!u)return gate();onSnapshot(collection(db,'orders'),s=>{O=s.docs.map(d=>d.data()).filter(o=>o.status!='done').sort((a,b)=>b.t-a.t);draw()},e=>$('#app').innerHTML='Ошибка: '+esc(e.code))});
</script></body></html>
