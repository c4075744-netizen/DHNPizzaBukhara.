*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px;background:#fff}
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:#fff}
header{position:sticky;top:0;z-index:20;background:var(--k);color:#fff}
.w{max-width:1200px;margin:auto;padding:0 18px}.top{display:flex;align-items:center;gap:22px;height:78px}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:26px}
.logo i{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px var(--y)}.logo img{width:50px}.logo b{color:var(--r)}
.nav{display:flex;gap:30px;font-weight:700}.nav a{color:#fff;text-decoration:none;cursor:pointer}.nav a:hover{color:var(--r)}.sp{flex:1}
.btn{border:0;border-radius:99px;padding:12px 24px;font:800 16px system-ui,sans-serif;color:#fff;background:var(--r);cursor:pointer;transition:.2s;box-shadow:0 6px 18px #c8102e44}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn.g{background:#0000000f;color:#111;box-shadow:none}header .btn.g{background:#ffffff1f;color:#fff}.btn.y{background:var(--y);color:#220;box-shadow:none}
.hero{position:relative;padding:70px 0 60px;color:#fff;background:#222 center/cover;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000d,#0006)}.hero .w{position:relative}
.bc{color:#ddd;font-size:15px;margin-bottom:18px}.bc b{color:var(--r)}
